<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Configurações PWA e Mobile Nativo -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#0284c7" />
    <meta name="description" content="Sistema Completo de Agendamentos, Financeiro, Clientes, Orçamentos, Recibos e Estoque" />

    <!-- Suporte PWA para Apple iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Escritório de Bolso" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <title>Escritório de Bolso - Gestão Empresarial</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- Registro do Service Worker do Aplicativo PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').then((reg) => {
            console.log('Aplicativo PWA registrado com sucesso:', reg.scope);
          }).catch((err) => {
            console.log('Erro ao registrar Service Worker:', err);
          });
        });
      }
    </script>
  </body>
</html>
